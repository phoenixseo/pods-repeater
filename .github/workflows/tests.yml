name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WP_VERSION: '6.8.2'
  PODS_VERSION: '3.3.9.1'

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / WP 6.8.2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']

    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: wp-tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=6

    steps:
      - uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip, gd
          coverage: none
          tools: composer:v2

      # Auf PHP 7.4 loest Composer die Test-Abhaengigkeiten neu auf: der Lock
      # stammt aus einem 8.3-Lauf, und doctrine/instantiator 2.x verlangt PHP 8.
      - name: Abhaengigkeiten (PHP 7.4, ohne Lock)
        if: matrix.php == '7.4'
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Abhaengigkeiten (PHP 8.3, mit Lock)
        if: matrix.php != '7.4'
        run: composer install --no-interaction --no-progress --prefer-dist

      # Der Testbootstrap erwartet unter ABSPATH eine echte WP-Installation
      # mit Pods daneben — derselbe Aufbau wie lokal unter wp-env, nur ohne
      # Docker: Core-Zip, Pods-Zip, Plugin als Symlink.
      - name: WordPress + Pods bereitstellen
        run: |
          set -eu
          curl -sSfL -o /tmp/wordpress.zip "https://wordpress.org/wordpress-${WP_VERSION}.zip"
          curl -sSfL -o /tmp/pods.zip "https://downloads.wordpress.org/plugin/pods.${PODS_VERSION}.zip"
          unzip -q /tmp/wordpress.zip -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/wordpress" "$RUNNER_TEMP/wp"
          unzip -q /tmp/pods.zip -d "$RUNNER_TEMP/wp/wp-content/plugins"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/wp/wp-content/plugins/pods-repeater"
          test -f "$RUNNER_TEMP/wp/wp-content/plugins/pods/init.php"
          test -f "$RUNNER_TEMP/wp/wp-settings.php"

      - name: PHPUnit
        env:
          WP_TESTS_DIR: ${{ github.workspace }}/vendor/wp-phpunit/wp-phpunit
          WP_TEST_ABSPATH: ${{ runner.temp }}/wp
          WP_TEST_DB_HOST: 127.0.0.1
          WP_TEST_DB_NAME: wp-tests
          WP_TEST_DB_USER: root
          WP_TEST_DB_PASSWORD: password
        run: |
          php -v | head -1
          vendor/bin/phpunit --testsuite PodsRepeater

  phpcs:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Abhaengigkeiten
        run: composer install --no-interaction --no-progress --prefer-dist

      # Nur Fehler zaehlen: die drei Warnungen sind ungenutzte Parameter in
      # Methoden, deren Signatur die Pods-API vorgibt.
      - name: PHPCS
        run: vendor/bin/phpcs pods-repeater.php includes classes ui --warning-severity=0
